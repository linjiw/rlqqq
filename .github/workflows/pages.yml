name: Deploy research dashboard

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "data/raw/**"
      - "models/live/**"
      - "requirements-browser.txt"
      - "requirements-live.txt"
      - "scripts/export_browser_policy.py"
      - "scripts/update_live_signal.py"
      - "scripts/verify_browser_inference.mjs"
      - "src/rlqqq/live.py"
      - "tests/**"
  schedule:
    # US market close is 20:00/21:00 UTC; avoid the busy top of the hour.
    # Evening attempt, late-evening retry (feeds publish on different
    # clocks), and a next-morning sweep that picks up laggard yield feeds
    # (the session validator aligns all feeds to the latest COMMON session,
    # so early runs are safe and later runs advance the date).
    - cron: "37 22 * * 1-5"
    - cron: "7 1 * * 2-6"
    - cron: "7 10 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-live.txt
            requirements-browser.txt
      - name: Install browser export and verification runtime
        run: python -m pip install --requirement requirements-browser.txt
      - name: Refresh signal and recursive browser replay
        if: github.event_name != 'push'
        run: python scripts/update_live_signal.py
      - name: Verify generated browser policy bundle
        run: python scripts/export_browser_policy.py --check
      - name: Run deployment contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_live.py tests/test_browser_contract.py
      - name: Verify vendored-WASM recursive browser parity
        run: node scripts/verify_browser_inference.mjs
      - name: Commit verified signal and replay records
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/live-signal.json \
            docs/assets/data/policy-input-history.json \
            docs/assets/data/python-reference.json \
            results/forward_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update live policy signal"
            # GITHUB_TOKEN pushes do not start another workflow. Push the
            # verified refresh, then let this same run deploy it below.
            git push origin HEAD:master
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
